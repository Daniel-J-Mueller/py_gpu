[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "py_gpu"
version = "0.0.1"
description = "Backend-agnostic GPU and accelerated rendering core experiments for Python scene packages."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "py_gpu contributors" }]
dependencies = []
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics :: 3D Rendering",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
opengl = ["moderngl>=5.10"]
webgpu = ["wgpu>=0.17"]
numeric = ["numpy>=2", "numba>=0.59"]

[project.urls]
Repository = "https://github.com/Daniel-J-Mueller/py_gpu"
Issues = "https://github.com/Daniel-J-Mueller/py_gpu/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
